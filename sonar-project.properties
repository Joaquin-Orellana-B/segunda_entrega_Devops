# ============================================================
# Identificación del Proyecto en SonarCloud / SonarQube
# ============================================================
sonar.projectKey=Prueba_pruebita
sonar.organization=gatolate
sonar.projectName=segunda_entrega_Devops
sonar.projectVersion=1.0.0

sonar.host.url=https://sonarcloud.io

# ============================================================
# Rutas de Código Fuente, Pruebas y Binarios Compilados
# ============================================================
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# ============================================================
# Reporte de Cobertura de JaCoCo
# ============================================================
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# ============================================================
# Exclusiones de Análisis (DTOs, Entidades y Clase Principal)
# ============================================================
sonar.exclusions=**/model/**, **/dto/**, **/exception/**, **/OrderManagerApplication.java

# ============================================================
# Configuración y Control de Calidad (Quality Gate)
# ============================================================
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true