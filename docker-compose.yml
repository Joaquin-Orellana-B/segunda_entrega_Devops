services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orders}
      POSTGRES_USER: ${POSTGRES_USER:-orders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orders-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

  api:
    image: order-manager:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-orders}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-orders}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-orders-local}
    ports:
      - "8098:8098"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8098/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data: