name: CI/CD Pipeline - Order Manager

on:
  push:
    branches: [ "main", "master", "develop/JO" ]
  pull_request:
    branches: [ "main", "master", "develop/JO" ]

env:
  JAVA_VERSION: '17'

jobs:
  # ==========================================================
  # JOB 1: TESTS & COBERTURA (IE2)
  # ==========================================================
  test-and-build:
    name: 🧪 Build, Tests & Cobertura JaCoCo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Compilar y Ejecutar Pruebas Automatizadas
        run: mvn clean verify -B

      - name: Guardar Reporte de Pruebas JUnit (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Guardar Reporte de Cobertura JaCoCo (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 7

  # ==========================================================
  # JOB 2: ANÁLISIS DE CALIDAD Y SEGURIDAD (IE3)
  # ==========================================================
  security-analysis:
    name: 🛡️ Análisis de Calidad y Seguridad (SonarQube)
    runs-on: ubuntu-latest
    needs: test-and-build
    # Se ejecuta solo si tienes configurado el secreto SONAR_TOKEN en GitHub
    if: ${{ secrets.SONAR_TOKEN != '' }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar Análisis en SonarCloud / SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io

  # ==========================================================
  # JOB 3: DESPLIEGUE E INTEGRACIÓN EN DOCKER (IE1, IE4 & IE5)
  # ==========================================================
  docker-integration:
    name: 🐳 Test Docker Compose Deployment & Healthcheck
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir y Levantar Contenedores
        run: docker compose up -d --build

      - name: Verificar Salud del Servicio (Actuator Healthcheck con reintentos)
        run: |
          echo "Esperando a que la aplicación esté completamente lista..."
          for i in {1..10}; do
            curl -s -f http://localhost:8098/actuator/health && break || echo "Esperando inicio de la API ($i/10)..."
            sleep 3
          done

      - name: Detener y Limpiar Contenedores
        if: always()
        run: docker compose down -v
