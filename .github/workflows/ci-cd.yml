name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "25"

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pruebas y empaquetado Maven
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Ejecutar pruebas y generar artefacto
        run: mvn --batch-mode --no-transfer-progress verify

  sonar:
    name: Análisis SonarCloud y Quality Gate
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Generar clases y reporte de cobertura
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Verificar configuración de SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_PROJECT_KEY" ] || [ -z "$SONAR_ORGANIZATION" ]; then
            echo "::error::Configura SONAR_TOKEN como secreto y SONAR_PROJECT_KEY / SONAR_ORGANIZATION como variables del repositorio."
            exit 1
          fi
      - name: Ejecutar análisis y esperar Quality Gate
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true

  image-security:
    name: Construir y escanear imagen Docker
    runs-on: ubuntu-latest
    needs: tests
    env:
      IMAGE_NAME: order-manager:${{ github.sha }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build --tag "$IMAGE_NAME" .
      - name: Escanear vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: order-manager:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy-simulated:
    name: Despliegue simulado con Docker Compose
    runs-on: ubuntu-latest
    needs: [sonar, image-security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Levantar API y PostgreSQL
        run: docker compose up --build --detach
      - name: Esperar disponibilidad de la API
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8098/actuator/health; then
              echo
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Limpiar entorno simulado
        if: always()
        run: docker compose down --volumes