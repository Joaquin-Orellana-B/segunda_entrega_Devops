name: CI/CD Pipeline - Order Manager

on:
  push:
    branches: [ "main", "master", "develop/**", "develop-vc-2", "pre-merge" ]
  pull_request:
    branches: [ "main", "master", "develop/**", "develop-vc-2", "pre-merge" ]

env:
  JAVA_VERSION: '17'
  IMAGE_NAME: order-manager

permissions:
  contents: read
  packages: write # Requerido para publicar en GHCR

jobs:
  # ==========================================================
  # JOB 1: TESTS Y COBERTURA (JaCoCo + Surefire)
  # ==========================================================
  test-and-build:
    name: 🧪 Tests y Cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }} (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Compilar y Ejecutar Pruebas Automatizadas
        run: mvn clean verify -B

      - name: Guardar Reporte de Pruebas JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Guardar Reporte de Cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 7

  # ==========================================================
  # JOB 2: ANÁLISIS DE SEGURIDAD Y CALIDAD (SonarCloud)
  # ==========================================================
  security-analysis:
    name: 🛡️ Análisis SonarCloud & Quality Gate
    runs-on: ubuntu-latest
    needs: test-and-build
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout del código (Historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar Análisis en SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "⚠️ SONAR_TOKEN no está configurado. Omitiendo análisis de SonarCloud."
            exit 0
          fi

          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || secrets.SONAR_ORGANIZATION }} \
            -Dsonar.qualitygate.wait=true

  # ==========================================================
  # JOB 3: PRUEBA DE INTEGRACIÓN DOCKER (Inyectando variables)
  # ==========================================================
  docker-integration-test:
    name: 🐳 Test de Integración Docker
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir y Levantar Contenedores
        env:
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: docker compose up -d --build

      - name: Verificar Salud del Servicio (Bucle de reintentos)
        run: |
          echo "Esperando a que la aplicación esté lista..."
          for i in {1..10}; do
            curl -s -f http://localhost:8098/actuator/health && break || echo "Esperando inicio de la API ($i/10)..."
            sleep 3
          done

      - name: Diagnóstico en caso de error
        if: failure()
        run: |
          docker logs order-db
          docker logs order-manager-app

      - name: Detener y Limpiar Contenedores
        if: always()
        run: docker compose down -v

  # ==========================================================
  # JOB 4: PUBLICACIÓN EN GHCR Y DESPLIEGUE (Solo main/master)
  # ==========================================================
  deploy:
    name: 🚀 Publicación GHCR y Despliegue
    runs-on: ubuntu-latest
    needs: [ security-analysis, docker-integration-test ]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    environment: production # Registra el entorno oficial en GitHub
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar metadatos y etiquetas (Commit SHA)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short,prefix=
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Construir y PUBLICAR imagen en GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Probar despliegue con la imagen publicada
        env:
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose up -d

      - name: Verificar salud del despliegue
        run: |
          echo "Verificando el estado del despliegue..."
          for i in {1..10}; do
            curl -s -f http://localhost:8098/actuator/health && break || echo "Esperando inicio del contenedor ($i/10)..."
            sleep 3
          done

      - name: Registrar Resumen del Despliegue en la UI de GitHub
        run: |
          echo "## 🚀 Resumen de Publicación y Despliegue" >> $GITHUB_STEP_SUMMARY
          echo "* **Entorno:** Production" >> $GITHUB_STEP_SUMMARY
          echo "* **Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Autor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "* **Imagen Trazable Publicada en GHCR:**" >> $GITHUB_STEP_SUMMARY
          echo "\`ghcr.io/${{ github.repository }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Estado:** Imagen construida, publicada en GHCR y desplegada exitosamente." >> $GITHUB_STEP_SUMMARY

      - name: Limpieza final
        if: always()
        run: docker compose down -v
