# Nombre del microservicio
spring.application.name=order-manager

# Puerto de ejecución en el contenedor
server.port=8098

# Configuración de Base de Datos PostgreSQL para Docker Compose
spring.datasource.url=jdbc:postgresql://db:5432/orderdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate para PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Monitoreo y Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always