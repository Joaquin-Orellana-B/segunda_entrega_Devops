apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: order-manager-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: order-manager-vs
spec:
  hosts:
    - "*"
  gateways:
    - order-manager-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: order-manager
            port:
              number: 8098